plugins {
    id 'com.android.application'
}

// The workflow passes the repository and build number; local builds fall back to these.
def repo = project.findProperty('repo') ?: 'spilak0203-debug/osc-alert'
def buildNumber = (project.findProperty('buildNumber') ?: '1') as Integer

android {
    namespace 'kr.personal.oscalert'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.personal.oscalert'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "2.${buildNumber}"
        buildConfigField 'String', 'REPO', "\"${repo}\""
        buildConfigField 'String', 'MARKET_URL', "\"https://github.com/${repo}/releases/download/market-data/market-v2.json\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Every build must be signed with the same key or updates will not install over the app.
        // The workflow swaps in `release.keystore` from repository secrets when they exist.
        release {
            storeFile file('release.keystore')
            storePassword project.findProperty('storePassword') ?: 'oscalert'
            keyAlias 'osc'
            keyPassword project.findProperty('keyPassword') ?: 'oscalert'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
