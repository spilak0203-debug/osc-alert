name: secret-check

# Every push and pull request: fails when a signing key (*.jks, *.keystore, *.jceks, *.bks, *.p12,
# *.pfx, *.pem, *.key, *.p8, *.pk8, a PEM private key block, JKS/JCEKS/PKCS12/PKCS#8 magic bytes,
# base64 text of a keystore) or a storePassword/keyPassword with a value is in the repository. This
# is a public repository and the original release key was once committed to it; see "Signing key"
# in the README. No path filter, so it always runs.
#
# The check looks at every commit that the push or pull request brings (a key added in one commit
# and deleted in the next is still in the history), then at the whole tree of HEAD. It runs after
# the push, so it reports a leak but cannot stop it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth 0: the commit range and the merge-base need the history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: self-test
        run: bash tool/check-secrets-test.sh
      - name: commits of this push / pull request
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
            head=$PR_HEAD
          else
            base=$BEFORE
            head=$SHA
            # A new branch (before is all zeros) or a force-push (the old tip is not in the
            # repository any more): everything since the branch left the default branch.
            if [ -z "${base//0/}" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git merge-base "origin/$DEFAULT_BRANCH" "$head")
            fi
          fi
          echo "checking $base..$head"
          bash tool/check-secrets.sh --range "$base" "$head"
      - name: tree of HEAD
        run: bash tool/check-secrets.sh
