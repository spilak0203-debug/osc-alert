name: secret-check

# Every push and pull request: fails when a signing key (*.jks, *.keystore, *.jceks, *.bks, *.p12,
# *.pfx, *.pem, *.key, *.p8, a PEM private key block, JKS/JCEKS magic bytes) or a
# storePassword/keyPassword line with a value is in the repository. This is a public repository
# and the original release key was once committed to it; see "Signing key" in the README. No path
# filter, so it always runs.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash tool/check-secrets.sh
