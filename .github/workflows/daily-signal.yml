name: daily-signal

# After the KRX close on weekdays: scan every stock, commit signals/latest.json, and upload the
# per-stock indicator snapshot (market.json) to the `market-data` pre-release for the app.
# Scheduled runs can start late, so there are two; an unchanged result makes no commit.
on:
  schedule:
    - cron: '50 6 * * 1-5'   # 15:50 KST
    - cron: '40 7 * * 1-5'   # 16:40 KST (in case the first run is late or fails)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python signal/scan.py
      - name: upload market data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release never becomes "latest", so it does not interfere with app updates.
          gh release view market-data >/dev/null 2>&1 || \
            gh release create market-data --prerelease --title "Market data" \
              --notes "Daily indicator snapshot for the app. Replaced after every scan."
          gh release upload market-data signals/market.json --clobber
      - name: commit signals
        run: |
          git config user.name "osc-alert bot"
          git config user.email "osc-alert-bot@users.noreply.github.com"
          git add signals/latest.json signals/history
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          ASOF=$(python -c "import json;print(json.load(open('signals/latest.json',encoding='utf-8'))['asof'])")
          git commit -m "signals: ${ASOF}"
          git pull --rebase
          git push
