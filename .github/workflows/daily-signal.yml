name: daily-signal

# 평일 장 마감 뒤 전 종목 일봉으로 오실레이터 3개 합치를 계산해 signals/latest.json에 커밋한다.
# GitHub 예약 실행은 수 분~30분 늦을 수 있다. 두 번 걸어 두고, 결과가 같으면 커밋하지 않는다.
on:
  schedule:
    - cron: '50 6 * * 1-5'   # 15:50 KST
    - cron: '40 7 * * 1-5'   # 16:40 KST (첫 실행이 늦거나 실패했을 때)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python signal/scan.py
      - name: commit signals
        run: |
          git config user.name "osc-alert bot"
          git config user.email "osc-alert-bot@users.noreply.github.com"
          git add signals
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          ASOF=$(python -c "import json;print(json.load(open('signals/latest.json',encoding='utf-8'))['asof'])")
          git commit -m "signals: ${ASOF}"
          git push
