name: release

# Builds the Flutter app for Android and Windows from `app/`. On main, each build is published
# as GitHub release `v<run number>` (version 2.<run number>) with `osc-alert.apk` and
# `osc-alert-setup.exe`, so both apps can update themselves. The run number continues the
# Java app's numbering, so its updater installs the Flutter build over it.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Prefer the signing key from repository secrets; otherwise use the one in the repository.
      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore; fi
      - name: build
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then
            printf 'storePassword=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" >> android/gradle.properties
          fi
          flutter build apk --release --build-name 2.${{ github.run_number }} --build-number ${{ github.run_number }} \
            --dart-define=REPO=${{ github.repository }}
          cp build/app/outputs/flutter-apk/app-release.apk ../osc-alert.apk
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-apk
          path: osc-alert.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Windows needs a three-part version (major.minor.patch) or it falls back to 1.0.0.
      - run: flutter build windows --release --build-name 2.${{ github.run_number }}.0 --build-number ${{ github.run_number }} --dart-define=REPO=${{ github.repository }}
      - name: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=2.${{ github.run_number }} "/DBuildDir=$PWD\build\windows\x64\runner\Release" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\installer\osc-alert-setup.exe ..\osc-alert-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-setup
          path: osc-alert-setup.exe

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" out/osc-alert.apk out/osc-alert-setup.exe \
            --title "2.${{ github.run_number }}" \
            --notes "$(git log -1 --format=%s)" \
            --latest
