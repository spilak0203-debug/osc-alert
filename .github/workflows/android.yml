name: release

# Releases the version in `app/pubspec.yaml` (`version: <name>+<build>`, see "Releases" in the
# README). When main gets a build number that has no release yet, the app is built for Android
# and Windows and published as GitHub release `v<build>` titled with the name, with
# `osc-alert.apk`, `osc-alert-setup.exe` and the changelog's top entry as notes, so both apps
# can update themselves. Any other push to main only runs the analyzer and the tests.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      title: ${{ steps.v.outputs.title }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version: *//p' app/pubspec.yaml)
          name=${v%+*}
          build=${v#*+}
          # 2.55.0 is shown as 2.55; 2.55.1 as is.
          title=${name%.0}
          if gh release view "v$build" >/dev/null 2>&1; then release=false; else release=true; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $name (build $build) · release: $release"

  # No new build number: nothing to publish, just check the code.
  check:
    needs: version
    if: needs.version.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Prefer the signing key from repository secrets; otherwise use the one in the repository.
      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore; fi
      - name: build
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$STORE_PASSWORD" ]; then
            printf 'storePassword=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" >> android/gradle.properties
          fi
          flutter build apk --release --dart-define=REPO=${{ github.repository }}
          cp build/app/outputs/flutter-apk/app-release.apk ../osc-alert.apk
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-apk
          path: osc-alert.apk

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The three-part name from pubspec.yaml (Windows falls back to 1.0.0 without one).
      - run: flutter build windows --release --dart-define=REPO=${{ github.repository }}
      - name: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ needs.version.outputs.title }} "/DBuildDir=$PWD\build\windows\x64\runner\Release" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\installer\osc-alert-setup.exe ..\osc-alert-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-setup
          path: osc-alert-setup.exe

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json; e = json.load(open('app/assets/changelog.json', encoding='utf-8'))[0]; print('\n'.join('- ' + i for i in e['items']))" > notes.md
          gh release create "v${{ needs.version.outputs.build }}" out/osc-alert.apk out/osc-alert-setup.exe \
            --title "${{ needs.version.outputs.title }}" \
            --notes-file notes.md \
            --latest
