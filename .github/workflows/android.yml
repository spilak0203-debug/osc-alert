name: android

# Builds the app. On main, each build is published as GitHub release `v<run number>` so the
# app can update itself; on other branches the APK is only kept as a workflow artifact.
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Prefer the signing key from repository secrets; otherwise use the one in the repository.
      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore; fi
      - name: test and build
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ARGS="-Prepo=${{ github.repository }} -PbuildNumber=${{ github.run_number }}"
          if [ -n "$STORE_PASSWORD" ]; then ARGS="$ARGS -PstorePassword=$STORE_PASSWORD -PkeyPassword=$STORE_PASSWORD"; fi
          gradle testReleaseUnitTest assembleRelease $ARGS
          cp app/build/outputs/apk/release/app-release.apk ../osc-alert.apk
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-apk
          path: osc-alert.apk
      - name: publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" osc-alert.apk \
            --title "2.${{ github.run_number }}" \
            --notes "$(git log -1 --format=%s)" \
            --latest
