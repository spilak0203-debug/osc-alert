name: release

# Releases the version in `app/pubspec.yaml` (`version: <name>+<build>`, see "Releases" in the
# README). When main gets a build number that has no release yet, the app is built for Android
# and Windows and published as GitHub release `v<build>` titled with the name, with
# `osc-alert.apk`, `osc-alert-setup.exe` and the changelog's top entry as notes, so both apps
# can update themselves. Any other push to main only runs the analyzer and the tests.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      title: ${{ steps.v.outputs.title }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version: *//p' app/pubspec.yaml)
          name=${v%+*}
          build=${v#*+}
          # 2.55.0 is shown as 2.55; 2.55.1 as is.
          title=${name%.0}
          if gh release view "v$build" >/dev/null 2>&1; then release=false; else release=true; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $name (build $build) · release: $release"

  # No new build number: nothing to publish, just check the code.
  check:
    needs: version
    if: needs.version.outputs.release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: version
    # Main only: the Environment `release` accepts no other branch, so a run started from another
    # branch (workflow_dispatch) skips this job instead of failing on it.
    if: needs.version.outputs.release == 'true' && github.ref == 'refs/heads/main'
    # A newer run replaces one that still waits for approval, so only the latest can be approved.
    concurrency:
      group: release-android-${{ github.ref }}
      cancel-in-progress: true
    # The four signing secrets exist only as secrets of the Environment `release` (required
    # reviewer, main only): the job starts after a reviewer approves it in the Actions tab.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # The keys come from the `release` Environment's secrets, never from the repository; without
      # all four the build stops. See "Signing key" in the README.
      - name: signing keys
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          OLD_KEYSTORE_B64: ${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}
          OLD_KEY_PROPERTIES: ${{ secrets.ANDROID_OLD_KEY_PROPERTIES }}
        run: |
          for s in KEYSTORE_B64 KEY_PROPERTIES OLD_KEYSTORE_B64 OLD_KEY_PROPERTIES; do
            if [ -z "${!s}" ]; then
              echo "::error::secret $s of the release environment is empty; see 'Signing key' in the README"
              exit 1
            fi
          done
          d="$RUNNER_TEMP/osc-signing"
          mkdir -p "$d"
          echo "$KEYSTORE_B64" | base64 -d > "$d/android-release.jks"
          echo "$OLD_KEYSTORE_B64" | base64 -d > "$d/old-release.jks"
          printf '%s\n' "$KEY_PROPERTIES" > "$d/android-release.properties"
          printf '%s\n' "$OLD_KEY_PROPERTIES" > "$d/old-release.properties"
          # Only the new key's passwords: the old key's are public, and masking them would hide the
          # package name (kr.personal.oscalert) in the logs.
          grep -E '^(storePassword|keyPassword)=' "$d/android-release.properties" | cut -d= -f2- | tr -d '\r' \
            | while IFS= read -r v; do if [ -n "$v" ]; then echo "::add-mask::$v"; fi; done
          echo "OSC_SIGNING_PROPERTIES=$d/android-release.properties" >> "$GITHUB_ENV"
      - name: build
        run: flutter build apk --release --dart-define=REPO=${{ github.repository }}
      # Signs with the old key's rotation lineage and checks the certificate seen at API 26, 28, 33.
      # apksigner is pinned to the build-tools the signing was checked with, not the runner's newest.
      - name: sign
        run: |
          bt=36.0.0
          if [ ! -x "$ANDROID_HOME/build-tools/$bt/apksigner" ]; then
            # `|| true`: yes ends with SIGPIPE, which would fail the step under pipefail.
            { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$bt" >/dev/null
          fi
          export APKSIGNER="$ANDROID_HOME/build-tools/$bt/apksigner"
          echo "apksigner $("$APKSIGNER" --version) ($bt)"
          d="$RUNNER_TEMP/osc-signing"
          bash android/sign-release.sh build/app/outputs/flutter-apk/app-release.apk "$d/signed.apk" \
            "$d/android-release.properties" "$d/old-release.properties" android/signing-lineage.bin
          cp "$d/signed.apk" ../osc-alert.apk
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-apk
          path: osc-alert.apk

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The three-part name from pubspec.yaml (Windows falls back to 1.0.0 without one).
      - run: flutter build windows --release --dart-define=REPO=${{ github.repository }}
      - name: installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=${{ needs.version.outputs.title }} "/DBuildDir=$PWD\build\windows\x64\runner\Release" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item build\installer\osc-alert-setup.exe ..\osc-alert-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-setup
          path: osc-alert-setup.exe

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json; e = json.load(open('app/assets/changelog.json', encoding='utf-8'))[0]; print('\n'.join('- ' + i for i in e['items']))" > notes.md
          gh release create "v${{ needs.version.outputs.build }}" out/osc-alert.apk out/osc-alert-setup.exe \
            --title "${{ needs.version.outputs.title }}" \
            --notes-file notes.md \
            --latest
