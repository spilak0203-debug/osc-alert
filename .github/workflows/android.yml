name: android

# 앱 APK를 굽는다. android/ 가 바뀌면 자동으로, 아니면 Actions 탭에서 수동 실행.
# 결과: 실행 페이지 하단 Artifacts의 osc-alert-apk (zip 안에 APK).
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # 저장소 시크릿에 서명 키가 있으면 그걸 쓴다. 없으면 저장소에 들어 있는 키를 쓴다.
      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore; fi
      - name: build
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ARGS="-PsignalsUrl=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/signals/latest.json"
          if [ -n "$STORE_PASSWORD" ]; then ARGS="$ARGS -PstorePassword=$STORE_PASSWORD -PkeyPassword=$STORE_PASSWORD"; fi
          gradle assembleRelease $ARGS
          cp app/build/outputs/apk/release/app-release.apk ../osc-alert.apk
      - uses: actions/upload-artifact@v4
        with:
          name: osc-alert-apk
          path: osc-alert.apk
