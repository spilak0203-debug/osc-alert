name: android-smoke

# Installs the app on an emulator, opens every tab, expands a stock and saves screenshots.
# Fails if the app crashes. Runs on pushes to work branches and by hand from the Actions tab.
on:
  push:
    branches-ignore: [main]
    paths: ['android/**', '.github/workflows/android-smoke.yml']
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: build
        working-directory: android
        run: gradle assembleRelease -Prepo=${{ github.repository }} -PbuildNumber=${{ github.run_number }}
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/smoke.sh android/app/build/outputs/apk/release/app-release.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: shots
